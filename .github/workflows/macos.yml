name: Build macOS

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build application
        run: bash ./mvnw -B clean javafx:jlink

      - name: Rename ZIP
        run: |
          mv target/app.zip target/v1.0.0-macos-${{ matrix.arch }}.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: v1.0.0-macos-${{ matrix.arch }}
          path: target/v1.0.0-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
