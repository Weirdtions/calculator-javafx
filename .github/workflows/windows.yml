
name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build application
        run: .\mvnw.cmd -B clean javafx:jlink

      - name: Rename ZIP
        shell: pwsh
        run: |
          Move-Item target/app.zip target/v1.0.0-windows.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-Windows
          path: target/v1.0.0-windows.zip
